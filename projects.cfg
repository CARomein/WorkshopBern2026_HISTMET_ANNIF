# Annif projects configuration
# Working backends: tfidf, omikuji (parabel/bonsai), mllm, yake, svc, nn_ensemble
# Excluded: fasttext (Windows build failure), pav, stwfsa (compatibility issues)
#
# Before running experiments, load vocabularies first:
#   annif load-vocab polmat_level2 vocab/polmat_level2.tsv
#   annif load-vocab polmat_level3 vocab/polmat_level3.tsv
#   annif load-vocab polmat_level4 vocab/polmat_level4.tsv

# ============================================================================
# TRANS_2020 - LEVEL 2
# ============================================================================

[trans_2020_level2_tfidf]
name=trans_2020 Level 2 - TF-IDF baseline
language=de
backend=tfidf
vocab=polmat_level2
analyzer=snowball(german)

[trans_2020_level2_omikuji_parabel]
name=trans_2020 Level 2 - Omikuji Parabel
language=de
backend=omikuji
vocab=polmat_level2
analyzer=snowball(german)
trainer=parabel

[trans_2020_level2_omikuji_bonsai]
name=trans_2020 Level 2 - Omikuji Bonsai
language=de
backend=omikuji
vocab=polmat_level2
analyzer=snowball(german)
trainer=bonsai

[trans_2020_level2_mllm]
name=trans_2020 Level 2 - MLLM
language=de
backend=mllm
vocab=polmat_level2
analyzer=snowball(german)

[trans_2020_level2_yake]
name=trans_2020 Level 2 - YAKE
language=de
backend=yake
vocab=polmat_level2
analyzer=snowball(german)

[trans_2020_level2_svc]
name=trans_2020 Level 2 - SVC
language=de
backend=svc
vocab=polmat_level2
analyzer=snowball(german)

[trans_2020_level2_nn_ensemble]
name=trans_2020 Level 2 - NN Ensemble
language=de
backend=nn_ensemble
vocab=polmat_level2
analyzer=snowball(german)
sources=trans_2020_level2_tfidf,trans_2020_level2_omikuji_parabel,trans_2020_level2_omikuji_bonsai,trans_2020_level2_svc, trans_2020_level2_mllm, trans_2020_level2_yake

